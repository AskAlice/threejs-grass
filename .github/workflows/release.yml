name: Release a package to npm & GitHub

# Tags are `<package>@<version>`, e.g. `threejs-grass@0.3.0`.
on:
  push:
    tags: ['*@[0-9]*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches the package version
        run: |
          name="${GITHUB_REF_NAME%@*}"
          test "$(npm pkg get version -w "$name" | node -pe "Object.values(JSON.parse(require('fs').readFileSync(0)))[0]")" = "${GITHUB_REF_NAME##*@}"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # dependencies' dist/ is needed for the package's .d.ts build
      - run: npm publish --provenance -w "$PACKAGE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
