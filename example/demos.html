<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>threejs-worldgen · demos</title>
    <style>
      :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3 }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 20px }
      h1 { margin: 0 0 4px; font-size: 28px }
      p.lead { margin: 0 0 28px; color: #9da7b3 }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px }
      a.card { display: block; padding: 16px; border: 1px solid #30363d; border-radius: 10px; background: #161b22; color: inherit; text-decoration: none }
      a.card:hover { border-color: #58a6ff }
      .card b { display: block; font-size: 16px }
      .card code { color: #7ee787; font-size: 12px }
      .card span { display: block; margin-top: 6px; color: #9da7b3; font-size: 13px }
      .missing { opacity: 0.45; pointer-events: none }
      .tag { float: right; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #30363d }
    </style>
  </head>
  <body>
    <main>
      <h1>threejs-worldgen demos</h1>
      <p class="lead">Live sandboxes for every package. Packages still being built show as dimmed until their demo page lands.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script type="module">
      const demos = [
        ['threejs-grass', 'index.html', 'Infinite WebGPU grass: presets, LODs, wind, painter (three.js + lil-gui)'],
        ['threejs-grass/react', 'r3f.html', 'The same grass as a React Three Fiber component with leva'],
        ['threejs-biomes', 'terrain.html', '20 biomes, planet or flat world, streaming LOD terrain from orbit to 1 cm, live maps'],
        ['threejs-water', 'water.html', 'Oceans, noise rivers and bounded hydrology'],
        ['threejs-scatter + trees', 'scatter.html', 'Blue-noise instancing, impostors, procedural trees and rocks'],
        ['threejs-sky', 'sky.html', 'Day/night, moon phases, Milky Way, shooting stars, solar system'],
        ['threejs-city', 'city.html', 'Settlements, roads, blocks, lots, buildings'],
        ['threejs-weathering', 'weathering.html', 'Rain, snow, lightning, wildfires, wet/snowy/burnt/damaged materials'],
        ['threejs-population', 'population.html', 'Population density on an H3 hexagonal grid'],
        ['threejs-fauna', 'fauna.html', 'Procedural fish schools'],
        ['threejs-worldgen', 'world.html', 'Everything together: the combined world'],
      ]
      const grid = document.getElementById('grid')
      for (const [name, page, text] of demos) {
        const a = document.createElement('a')
        a.className = 'card'
        a.href = page
        a.innerHTML = `<b>${name}</b><code>${page}</code><span>${text}</span>`
        grid.append(a)
        // Dim demos whose page doesn't exist yet.
        fetch(page, { method: 'HEAD' }).then((r) => {
          const html = r.ok && (r.headers.get('content-type') ?? '').includes('html')
          if (!html) { a.classList.add('missing'); a.querySelector('b').insertAdjacentHTML('afterbegin', '<em class="tag">in progress</em>') }
        })
      }
    </script>
  </body>
</html>
